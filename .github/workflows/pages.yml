name: Check and publish Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      notes: ${{ steps.release.outputs.notes }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:source
      - run: npm test
      - name: Use the Ubuntu archive for browser dependencies
        run: sudo find /etc/apt -maxdepth 2 -type f \( -name '*.list' -o -name '*.sources' -o -name 'apt-mirrors.txt' \) -exec sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' {} +
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run build
      - run: npm run test:webkit
      - run: npm run test:browser
      - run: npm run build
      - run: npm run check:build
      - name: Read checked release metadata
        id: release
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync, appendFileSync } from 'node:fs';
          import { texts } from './web/src/i18n.mjs';
          const version = /data-read="version">([^<]+)</.exec(readFileSync('dist/index.html', 'utf8'))?.[1];
          assert.match(version, /^v[1-9]\d*(?:[.-][a-z0-9]+)*$/);
          const notes = texts.en.releaseNotes;
          assert.doesNotMatch(notes, /[\r\n]/);
          appendFileSync(process.env.GITHUB_OUTPUT, 'version=' + version + '\nnotes=' + notes + '\n');
          NODE
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - name: Publish checked build
        id: deployment
        uses: actions/deploy-pages@v5

  release:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [check, deploy]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.check.outputs.version }}
          RELEASE_NOTES: ${{ needs.check.outputs.notes }}
        run: |
          tag_refs=$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$RELEASE_VERSION" --jq '.[].ref')
          if printf '%s\n' "$tag_refs" | grep -Fxq "refs/tags/$RELEASE_VERSION"; then
            tag_commit=$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_VERSION" --jq .sha)
            if [ "$tag_commit" != "$GITHUB_SHA" ]; then
              printf 'Release %s already belongs to another commit. Use a new version.\n' "$RELEASE_VERSION" >&2
              exit 1
            fi
          fi
          if ! gh release view "$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            printf '%s\n' "$RELEASE_NOTES" > "$RUNNER_TEMP/release-notes.txt"
            gh release create "$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" --title "JUGGERMASTER $RELEASE_VERSION" \
              --notes-file "$RUNNER_TEMP/release-notes.txt" --latest
          fi
